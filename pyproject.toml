[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mf-faq"
version = "0.1.0"
description = "Facts-only FAQ assistant over five HDFC Mutual Fund pages on Groww"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "streamlit>=1.36",
  "sentence-transformers>=2.7",
  "torch>=2.3",
  "transformers>=4.41",
  "chromadb>=0.5",
  "numpy>=1.26",
  "httpx>=0.27",
  "selectolax>=0.3",
  "trafilatura>=1.12",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "openai>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
]
scrape = ["playwright>=1.44"]

[project.scripts]
mf-faq-healthcheck = "mf_faq.healthcheck:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mf_faq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "live: hits the real network or a real LLM provider (not run by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = false
files = ["src"]
